[project]
name = "mechid-analysis"
version = "2026.1.0"
description = "MechID: turn on-robot characterization data into feedforward, PID, Motion Magic, and current-limit recommendations for FRC mechanisms"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "plotly>=5.18",
]

[project.scripts]
mechid = "mechid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechid"]

[dependency-groups]
dev = ["pytest>=8.0"]
